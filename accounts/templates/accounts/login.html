{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GBOMDIA | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --green-dark: #0f7a43;
            --green: #16b86a;
            --green-soft: #34b79f;
            --gold: #d4a11e;
            --blue: #114c8d;
            --cream: #f8f6ef;
            --text: #163127;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, var(--green), var(--green-soft), var(--blue));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 370px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.18), rgba(15,122,67,0.20));
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            border-radius: 34px;
            padding: 34px 28px;
            position: relative;
            overflow: hidden;
            text-align: center;
            color: var(--cream);
            box-shadow: 0 20px 50px rgba(0,0,0,0.22);
            animation: cardIn 0.8s ease both;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -30px;
            width: 260px;
            height: 200px;
            background: rgba(255,255,255,0.16);
            border-radius: 42% 58% 68% 32% / 42% 48% 60% 52%;
            animation: floatSoft 7s ease-in-out infinite;
        }

        .auth-card::after {
            content: "";
            position: absolute;
            bottom: -45px;
            left: -25px;
            width: 170px;
            height: 120px;
            background: rgba(212,161,30,0.22);
            border-radius: 50%;
            animation: floatSoft 8s ease-in-out infinite reverse;
        }

        .auth-content {
            position: relative;
            z-index: 2;
        }

        .auth-logo {
            width: 92px;
            height: 92px;
            object-fit: contain;
            margin-bottom: 18px;
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.16));
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0 0 24px;
            opacity: 0.9;
            font-size: 14px;
            line-height: 1.6;
        }

        .auth-input-wrap {
            margin-bottom: 14px;
            position: relative;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 999px;
            background: rgba(255,255,255,0.96);
            color: var(--text);
            outline: none;
            font-size: 15px;
        }

        .password-wrap .auth-input {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--blue);
            font-size: 17px;
            cursor: pointer;
            padding: 0;
        }

        .auth-btn {
            width: 100%;
            border: none;
            padding: 13px 16px;
            border-radius: 999px;
            background: var(--cream);
            color: var(--blue);
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.25s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
        }

        .auth-links {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.8;
        }

        .auth-links a {
            color: var(--cream);
            font-weight: 800;
        }

        .message {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.20);
            padding: 10px;
            border-radius: 14px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-content">
            <img src="{% static 'images/logo.png' %}" alt="GBOMDIA Logo" class="auth-logo">

            <h1>Welcome Back</h1>
            <p class="subtitle">Login to continue to your GBOMDIA account.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="auth-input-wrap">
                    <input type="text" name="username_or_email" placeholder="Email or username" class="auth-input" required>
                </div>

                <div class="auth-input-wrap password-wrap">
                    <input type="password" name="password" id="loginPassword" placeholder="Password" class="auth-input" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">👁</button>
                </div>

                <button type="submit" class="auth-btn">LOG IN</button>
            </form>

            <div class="auth-links">
                <div><a href="{% url 'forgot_password_page' %}">Forgot password?</a></div>
                <div>Don’t have an account? <a href="{% url 'signup_page' %}">Create Account</a></div>
                <div><a href="{% url 'home' %}">Back to Website</a></div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }
        }
    </script>
</body>
</html>
