{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | GBOMDIA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #16b86a, #34b79f, #114c8d);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 390px;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            color: #f8f6ef;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.22);
        }
        img {
            width: 84px;
            height: 84px;
            object-fit: contain;
            margin-bottom: 14px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 999px;
            margin: 8px 0;
            font-size: 15px;
            outline: none;
        }
        button {
            display: block;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 999px;
            background: #f8f6ef;
            color: #114c8d;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }
        .message {
            background: rgba(255,255,255,0.18);
            padding: 10px;
            border-radius: 14px;
            margin-bottom: 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="card">
    <img src="{% static 'images/logo.png' %}" alt="GBOMDIA Logo">
    <h1>Reset Password</h1>
    <p>Enter the reset code sent to {{ email }}.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="code" placeholder="Reset code" required>
        <input type="password" name="password1" placeholder="New password" required>
        <input type="password" name="password2" placeholder="Confirm password" required>
        <button type="submit">Reset Password</button>
    </form>
</div>
</body>
</html>
