{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Daily Business Amount</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #16b86a, #34b79f, #114c8d);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.18);
            text-align: center;
        }

        h1 {
            color: #0f7a43;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            margin: 18px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #16b86a, #114c8d);
            color: white;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Daily Business Amount</h1>
    <p>Enter today’s opening business amount before accessing the system.</p>

    <form method="post">
        {% csrf_token %}
        <input type="number" step="0.01" name="opening_amount" placeholder="Enter today opening amount" required>
        <button type="submit">Continue</button>
    </form>
</div>
</body>
</html>
