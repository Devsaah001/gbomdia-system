{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GBOMDIA Dashboard{% endblock %}</title>
    <style>
        :root {
            --green-dark: #0f7a43;
            --green: #16b86a;
            --green-soft: #34b79f;
            --gold: #d4a11e;
            --blue: #114c8d;
            --cream: #f8f6ef;
            --text: #163127;
            --muted: #5f7468;
            --white: #ffffff;
            --shadow: 0 18px 40px rgba(0,0,0,0.10);
            --card-shadow: 0 12px 28px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(22,184,106,0.10), transparent 25%),
                radial-gradient(circle at bottom right, rgba(17,76,141,0.08), transparent 30%),
                linear-gradient(180deg, #eef7f1 0%, #f8fbf8 100%);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        .dashboard-wrap {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 18px 50px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .title-box h1 {
            margin: 0;
            font-size: 34px;
            color: var(--green-dark);
            letter-spacing: -0.03em;
        }

        .title-box p {
            margin: 8px 0 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border-radius: 999px;
            background: var(--white);
            color: var(--text);
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(15,122,67,0.08);
            font-size: 14px;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn.primary {
            background: linear-gradient(135deg, var(--green), var(--blue));
            color: var(--cream);
        }

        .hero-panel {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-soft) 45%, var(--blue) 100%);
            color: var(--cream);
            border-radius: 28px;
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
        }

        .hero-panel::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -25px;
            width: 220px;
            height: 180px;
            background: radial-gradient(circle at center, rgba(248,246,239,0.34), rgba(248,246,239,0.08));
            border-radius: 42% 58% 68% 32% / 42% 48% 60% 52%;
            animation: floatSoft 7s ease-in-out infinite;
        }

        .hero-panel::after {
            content: "";
            position: absolute;
            bottom: -35px;
            left: -20px;
            width: 150px;
            height: 100px;
            background: radial-gradient(circle at center, rgba(212,161,30,0.24), rgba(248,246,239,0.06));
            border-radius: 50%;
            animation: floatSoft 8s ease-in-out infinite reverse;
        }

        .hero-panel > * {
            position: relative;
            z-index: 2;
        }

        .hero-panel h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .hero-panel p {
            margin: 0;
            line-height: 1.8;
            max-width: 760px;
            color: rgba(248,246,239,0.95);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 22px;
            padding: 22px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(15,122,67,0.08);
            transition: 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card h3 {
            margin: 0 0 8px;
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .stat-card p {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            color: var(--blue);
        }

        .panel {
            background: var(--white);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(15,122,67,0.08);
            margin-bottom: 20px;
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 22px;
            color: var(--green-dark);
        }

        .panel p {
            color: var(--muted);
            line-height: 1.8;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .quick-link {
            display: block;
            background: linear-gradient(180deg, #ffffff 0%, #f7fbf8 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(15,122,67,0.08);
            transition: 0.25s ease;
        }

        .quick-link:hover {
            transform: translateY(-4px);
        }

        .quick-link strong {
            display: block;
            margin-bottom: 8px;
            color: var(--blue);
            font-size: 17px;
        }

        .quick-link span {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(15,122,67,0.08);
            font-size: 14px;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: #f8fbf8;
        }

        .badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge.active, .badge.approved {
            background: rgba(22,184,106,0.12);
            color: var(--green-dark);
        }

        .badge.pending {
            background: rgba(212,161,30,0.14);
            color: #8b6500;
        }

        .badge.rejected {
            background: rgba(220,38,38,0.10);
            color: #b91c1c;
        }

        .badge.overdue {
            background: rgba(190,24,93,0.10);
            color: #be123c;
        }

        .summary-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .summary-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: #f8fafc;
            border: 1px solid rgba(15,122,67,0.08);
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        .activity-item {
            padding: 14px 0;
            border-bottom: 1px solid rgba(15,122,67,0.08);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-title {
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text);
        }

        .activity-meta {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            background: rgba(22,184,106,0.12);
            color: var(--green-dark);
            font-weight: 700;
            font-size: 14px;
        }

        @keyframes floatSoft {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(10px); }
        }

        @media (max-width: 980px) {
            .stats-grid,
            .panel-grid,
            .quick-links {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 760px) {
            .stats-grid,
            .panel-grid,
            .quick-links {
                grid-template-columns: 1fr;
            }

            .title-box h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-wrap">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
